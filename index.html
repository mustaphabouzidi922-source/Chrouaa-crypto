<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شروعة كريبتو - منصة إنشاء العملات الرقمية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 100%; max-width: 450px; }
        hh2, h1 { text-align: center; color: #38bdf8; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #475569; background: #0f172a; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #0ea5e9; }
        #connectWallet { background: #10b981; margin-bottom: 20px; }
        #connectWallet:hover { background: #059669; }
        .status { margin-top: 15px; text-align: center; font-size: 14px; color: #38bdf8; }
    </style>
</head>
<body>

    <div class="container">
        <h1>شروعة كريبتو</h1>
        <p style="text-align: center; font-size: 13px; color: #94a3b8;">أنشئ عملتك الرقمية BEP-20 فوراً وبكل سهولة</p>
        
        <button id="connectWallet" onclick="connectWallet()">ربط المحفظة</button>
        <p id="walletAddress" style="font-size: 12px; text-align: center; color: #cbd5e1; word-break: break-all;"></p>

        <div class="form-group">
            <label>اسم العملة (Token Name):</label>
            <input type="text" id="tokenName" placeholder="مثال: Medea Token">
        </div>

        <div class="form-group">
            <label>رمز العملة (Symbol):</label>
            <input type="text" id="tokenSymbol" placeholder="مثال: MED">
        </div>

        <div class="form-group">
            <label>الكمية الإجمالية (Total Supply):</label>
            <input type="number" id="tokenSupply" placeholder="مثال: 1000000">
        </div>

        <button onclick="createToken()">إنشاء العملة (رسوم: 0.001 BNB)</button>
        
        <p class="status" id="statusMessage"></p>
    </div>

    <script>
        // عنوان عقد المصنع الموثق الخاص بك
        const CONTRACT_ADDRESS = "0x4C1356e1C34C0fCcF7f291364c04D435eE8D9934";
        
        // ABI الخاص بدالة إنشاء العملة في العقد
        const CONTRACT_ABI = [
            "function createToken(string memory _name, string memory _symbol, uint256 _totalSupply, address _referrer) external payable returns (address)",
            "function creationFee() public view returns (uint256)"
        ];

        let provider, signer, factoryContract;

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    const address = await signer.getAddress();
                    
                    document.getElementById("walletAddress").innerText = "المحفظة المتصلة: " + address;
                    document.getElementById("connectWallet").innerText = "تم الاتصال بنجاح";
                    
                    factoryContract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
                } catch (error) {
                    alert("فشل اتصال المحفظة: " + error.message);
                }
            } else {
                alert("يرجى تثبيت محفظة MetaMask أو استخدام متصفح يدعم Web3");
            }
        }

        async function createToken() {
            if (!factoryContract) {
                alert("الرجاء ربط المحفظة أولاً!");
                return;
            }

            const name = document.getElementById("tokenName").value;
            const symbol = document.getElementById("tokenSymbol").value;
            const supply = document.getElementById("tokenSupply").value;

            if (!name || !symbol || !supply) {
                alert("الرجاء ملء جميع الحقول المطلوبة!");
                return;
            }

            try {
                document.getElementById("statusMessage").innerText = "جاري تنفيذ المعاملة وإرسال الرسوم...";
                
                // جلب قيمة الرسوم المحددة في العقد (0.001 BNB)
                const fee = await factoryContract.creationFee();
                
                // عنوان إحالة افتراضی (صفر) إذا لم يوجد محاحي إحالة
                const referrer = "0x0000000000000000000000000000000000000000";

                const tx = await factoryContract.createToken(name, symbol, supply, referrer, { value: fee });
                
                document.getElementById("statusMessage").innerText = "تم إرسال المعاملة، بانتظار التأكيد...";
                
                await tx.wait();
                
                document.getElementById("statusMessage").innerText = "🎉 مبروك! تم إنشاء عملتك بنجاح وتوجيه الرسوم لمستحقها.";
            }
            error => {
                document.getElementById("statusMessage").innerText = "حدث خطأ: " + (error.message || error);
            }
        }
    </script>
</body>
</html>
